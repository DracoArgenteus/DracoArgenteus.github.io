#deploy.yml

name: Build and Deploy Pelican Site

on:
  push:
    branches:
      - main # Trigger on pushes to your 'main' branch
  workflow_dispatch: # Allows manual triggering of the workflow from the GitHub UI

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest # GitHub-hosted runner, a Linux environment

    # Define permissions for the GITHUB_TOKEN
    permissions:
      contents: write # Required for actions/checkout and peaceiris/actions-gh-pages to push to gh-pages
      pages: write    # Required for deploying to GitHub Pages
      id-token: write # Required for OIDC, often used by GitHub Pages deployments

    # Concurrency group to (not) cancel in-progress runs if a new push occurs on the same branch
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 
        cache: 'pip' # Cache pip dependencies for faster subsequent runs

    - name: Install Python dependencies
      # Conditionally install from requirements.txt if it exists, otherwise install core dependencies.
      # This is more robust for templates that might or might not ship with a requirements.txt initially.
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "requirements.txt not found. Installing core Pelican dependencies."
          pip install pelican PyYAML markdown bibtexparser invoke
          # Add any other core dependencies for al-folio-python if not in requirements.txt
        fi

    # Note: Your pelicanconf.py has 'render_main_scss(SITE)' which handles SCSS compilation in Python.
    # This typically means you do *not* need a separate Node.js setup or npm install for Sass.

    - name: Build Pelican site
      # Use the specific build command instructed by the template author.
      # This command will use publishconf.py, which typically has SITEURL set for the live domain.
      run: python -m pelican -s publishconf.py

    # Fix permissions for the output directory before deployment.
    # This ensures files created by Pelican/Python have correct read/execute permissions for the web server.
    - name: Fix permissions for output directory
      run: |
        chmod -c -R +rX "output/" | while read line; do echo "Changed: $line"; done

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output
        publish_branch: gh-pages
        # For a user page (DracoArgenteus.github.io), you typically don't need the 'cname' option here.
        # GitHub Pages handles the domain implicitly for user pages.
        # cname: dracoargenteus.github.io # Uncomment ONLY if you explicitly want a CNAME file for THIS specific domain.